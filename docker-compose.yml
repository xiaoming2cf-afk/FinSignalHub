name: finsignalhub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsignalhub_dev}
      POSTGRES_USER: ${POSTGRES_USER:-finsignalhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsignalhub_dev_password_placeholder}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mcp_server:
    build:
      context: .
      dockerfile: apps/mcp_server/Dockerfile
    ports:
      - "${MCP_SERVER_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy

  web_admin:
    build:
      context: .
      dockerfile: apps/web_admin/Dockerfile
    ports:
      - "${WEB_ADMIN_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
