name: Stage Governance CI

on:
  pull_request:
  push:
    branches:
      - "stage/**"

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Stage 00 governance artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "AGENTS.md"
            "PLANS.md"
            "CONTROL/00_MASTER_CONTROL.md"
            "CONTROL/16_CAPABILITY_AUDIT.md"
            "CONTROL/20_BLOCKER_LOG.md"
            "reviews/stage_00/GPT_PRO_REVIEW_PACKET.md"
            "reviews/stage_00/PR_BODY.md"
            "finsignalhub-codex-plugin/.codex-plugin/plugin.json"
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing required file: $path"; exit 1; }
          done
          skill_count="$(find .agents/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)"
          test "$skill_count" -ge 15 || { echo "Expected at least 15 local skills, found $skill_count"; exit 1; }
          for f in CONTROL/*.md; do
            grep -q "## Purpose" "$f"
            grep -q "## Owner" "$f"
            grep -q "## When to update" "$f"
            grep -q "## Required fields" "$f"
            grep -q "## Example format" "$f"
            grep -q "## Current state" "$f"
          done

      - name: Run Stage 01 phase check
        shell: bash
        run: python finsignalhub-codex-plugin/scripts/phase_check.py --stage 01

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python scaffold dependencies
        shell: bash
        run: python -m pip install -e ".[test]"

      - name: Test API and MCP scaffold
        shell: bash
        run: python -m pytest apps/api/tests apps/mcp_server/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install web admin dependencies
        shell: bash
        run: npm --prefix apps/web_admin --workspaces=false ci

      - name: Build web admin scaffold
        shell: bash
        run: npm run web:build

      - name: Audit web admin dependencies
        shell: bash
        run: npm run web:audit

      - name: Validate Docker Compose
        shell: bash
        run: docker compose config

      - name: Smoke test Docker Compose services
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose down -v' EXIT
          docker compose up --build -d
          for url in \
            "http://localhost:8000/health" \
            "http://localhost:8001/health" \
            "http://localhost:8001/server-info" \
            "http://localhost:3000"; do
            for attempt in {1..30}; do
              if curl --fail --silent "$url" > /tmp/finsignalhub-smoke.txt; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Smoke check failed for $url"
                docker compose ps
                docker compose logs --no-color --tail=80
                exit 1
              fi
              sleep 2
            done
          done
          curl --fail --silent http://localhost:8000/health | grep '"service":"api"'
          curl --fail --silent http://localhost:8001/server-info | grep '"tools_enabled":false'
          curl --fail --silent http://localhost:3000 | grep 'Repo Scaffold'
