[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsignalhub"
version = "0.1.0"
description = "FinSignalHub Stage 01 scaffold for health-only API and MCP server surfaces."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136,<0.137",
  "uvicorn[standard]>=0.46,<0.47",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<0.29",
  "pytest>=8.4,<10",
]

[tool.setuptools.packages.find]
where = ["apps/api", "apps/mcp_server"]
include = ["finsignalhub_api*", "finsignalhub_mcp_server*"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "apps/mcp_server"]
testpaths = ["apps/api/tests", "apps/mcp_server/tests"]
